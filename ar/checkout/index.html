;s3&quot;:&quot;المراجعة&quot;,&quot;name&quot;:&quot;الاسم بالكامل&quot;,&quot;email&quot;:&quot;البريد الإلكتروني&quot;,&quot;phone&quot;:&quot;الموبايل&quot;,&quot;city&quot;:&quot;المدينة&quot;,&quot;address&quot;:&quot;العنوان&quot;,&quot;card&quot;:&quot;رقم الكارت&quot;,&quot;exp&quot;:&quot;الانتهاء (شش/سس)&quot;,&quot;cvv&quot;:&quot;الرمز&quot;,&quot;cardName&quot;:&quot;الاسم على الكارت&quot;,&quot;next&quot;:&quot;متابعة&quot;,&quot;back&quot;:&quot;رجوع&quot;,&quot;place&quot;:&quot;تأكيد الطلب&quot;,&quot;errors&quot;:{&quot;name&quot;:&quot;من فضلك اكتبي اسمك&quot;,&quot;email&quot;:&quot;أدخلي بريدًا صحيحًا&quot;,&quot;phone&quot;:&quot;أدخلي رقم موبايل صحيح&quot;,&quot;city&quot;:&quot;أدخلي المدينة&quot;,&quot;address&quot;:&quot;أدخلي العنوان&quot;,&quot;card&quot;:&quot;16 رقم بدون مسافات&quot;,&quot;exp&quot;:&quot;بصيغة شش/سس&quot;,&quot;cvv&quot;:&quot;3 أرقام&quot;,&quot;cardName&quot;:&quot;مطلوب&quot;},&quot;mock&quot;:&quot;تجربة عرض — مفيش دفع حقيقي بيتم.&quot;,&quot;successTitle&quot;:&quot;تم تأكيد الطلب&quot;,&quot;successSub&quot;:&quot;شكرًا لكِ. رقم طلبك:&quot;,&quot;successNote&quot;:&quot;في النسخة الحقيقية هيوصلك تأكيد بالبريد.&quot;,&quot;home&quot;:&quot;ارجعي للدار&quot;}" hidden></div><div id="ck-root"></div></main></main><footer class="site-footer"><div class="footer-inner container"><span class="logo">N<span class="accent">i</span>vora</span><span>© 2026 نيفورا — جميع الحقوق محفوظة</span><span>صُنع بإتقان</span></div></footer><script type="module">var e=document.getElementById(`burger`),t=document.getElementById(`mobile-menu`),n=document.getElementById(`mm-close`),r=n=>{e?.setAttribute(`aria-expanded`,String(n)),t?.setAttribute(`aria-hidden`,String(!n)),document.body.style.overflow=n?`hidden`:``};e?.addEventListener(`click`,()=>r(e.getAttribute(`aria-expanded`)!==`true`)),n?.addEventListener(`click`,()=>r(!1)),t?.querySelectorAll(`a`).forEach(e=>e.addEventListener(`click`,()=>r(!1))),document.addEventListener(`keydown`,e=>{e.key===`Escape`&&r(!1)});var i=(e,t)=>{try{return JSON.parse(localStorage.getItem(e))||t}catch{return t}},a=()=>{let e=i(`nivora_bag`,[]).length,t=i(`nivora_wish`,[]).length,n=document.getElementById(`bag-count`),r=document.getElementById(`wish-count`);n&&(n.textContent=e,n.style.display=e?``:`none`),r&&(r.textContent=t,r.style.display=t?``:`none`)};window.nivoraBump=a,a();</script></body></html><script>
  const lang = document.documentElement.lang;
  const t = JSON.parse(document.getElementById('flow-data').dataset.t);
  const L = (en, ar) => (lang === 'ar' ? ar : en);
  const fmt = (n) => (lang === 'ar' ? n.toLocaleString('ar-EG') + ' ج' : 'EGP ' + n.toLocaleString('en-US'));
  const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const root = document.getElementById('ck-root');
  let step = 1;
  const data = { name: '', email: '', phone: '', city: '', address: '', card: '', exp: '', cvv: '', cardName: '' };
  let orderNo = '';

  const field = (id, label, val, half) =>
    '<div class="f-field' + (half ? '' : ' full') + '" id="w-' + id + '"><label for="' + id + '">' + label + '</label>' +
    '<input id="' + id + '" value="' + (val || '') + '"><span class="f-err"></span></div>';

  const render = () => {
    document.querySelectorAll('.step').forEach((s) => {
      const n = Number(s.dataset.s);
      s.classList.toggle('on', n === step);
      s.classList.toggle('done', n < step);
    });
    const items = get('nivora_bag', []);
    const total = items.reduce((s2, it) => s2 + it.price * (it.qty || 1), 0);

    if (step === 1) {
      root.innerHTML = '<form class="form-card" id="ck-form"><div class="f-grid">' +
        field('name', t.name, data.name) + field('email', t.email, data.email) +
        field('phone', t.phone, data.phone, true) + field('city', t.city, data.city, true) +
        field('address', t.address, data.address) +
        '</div><div class="f-actions"><span></span><button type="submit" class="btn btn-solid">' + t.next + '</button></div></form>';
    } else if (step === 2) {
      root.innerHTML = '<form class="form-card" id="ck-form"><div class="f-grid">' +
        field('card', t.card, data.card) + field('cardName', t.cardName, data.cardName) +
        field('exp', t.exp, data.exp, true) + field('cvv', t.cvv, data.cvv, true) +
        '</div><p class="mock-note">' + t.mock + '</p>' +
        '<div class="f-actions"><button type="button" class="btn btn-outline" id="back">' + t.back + '</button><button type="submit" class="btn btn-solid">' + t.next + '</button></div></form>';
    } else if (step === 3) {
      root.innerHTML = '<div class="form-card">' +
        '<div class="rev-box"><b>' + t.s1 + '</b>' + data.name + ' · ' + data.email + '<br>' + data.city + ' — ' + data.address + '</div>' +
        '<div class="rev-box"><b>' + t.s2 + '</b>•••• •••• •••• ' + data.card.slice(-4) + '</div>' +
        '<div class="rev-box"><b>' + L('ORDER', 'الطلب') + ' (' + items.length + ')</b>' + fmt(total) + '</div>' +
        '<div class="f-actions"><button class="btn btn-outline" id="back">' + t.back + '</button><button class="btn btn-solid" id="place">' + t.place + '</button></div></div>';
    } else {
      root.innerHTML = '<div class="success"><div class="tick">✓</div><h2>' + t.successTitle + '</h2>' +
        '<p>' + t.successSub + '</p><p class="order-no">NV-' + orderNo + '</p>' +
        '<p class="mock-note">' + t.successNote + '</p>' +
        '<a href="/' + lang + '" class="btn btn-outline" style="margin-top:22px">' + t.home + '</a></div>';
      localStorage.removeItem('nivora_bag');
      window.nivoraBump?.();
    }

    document.getElementById('back')?.addEventListener('click', () => { step--; render(); });
    document.getElementById('place')?.addEventListener('click', () => {
      orderNo = String(Math.floor(100000 + Math.random() * 900000));
      step = 4; render();
    });
    document.getElementById('ck-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const ids = step === 1 ? ['name', 'email', 'phone', 'city', 'address'] : ['card', 'cardName', 'exp', 'cvv'];
      const rules = {
        name: (v) => v.trim().length > 1, email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
        phone: (v) => /^[0-9+\s]{8,}$/.test(v), city: (v) => v.trim().length > 1, address: (v) => v.trim().length > 3,
        card: (v) => /^[0-9]{16}$/.test(v.replace(/\s/g, '')), cardName: (v) => v.trim().length > 1,
        exp: (v) => /^[0-9]{2}\/[0-9]{2}$/.test(v), cvv: (v) => /^[0-9]{3}$/.test(v),
      };
      let ok = true;
      ids.forEach((id) => {
        const el = document.getElementById(id);
        data[id] = el.value;
        const good = rules[id](el.value);
        document.getElementById('w-' + id).classList.toggle('has-error', !good);
        document.getElementById('w-' + id).querySelector('.f-err').textContent = good ? '' : t.errors[id];
        if (!good) ok = false;
      });
      if (ok) { step++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  };
  render();
</script>
