><header class="flow-head"><p class="eyebrow">إتمام آمن</p><h1>إتمام الشراء</h1></header><div class="steps" id="steps"><div class="step on" data-s="1"><span class="n">1</span>بيانات التوصيل</div><div class="step" data-s="2"><span class="n">2</span>طريقة الدفع</div><div class="step" data-s="3"><span class="n">3</span>المراجعة</div></div><div id="flow-data" data-t="{&quot;eyebrow&quot;:&quot;إتمام آمن&quot;,&quot;title&quot;:&quot;إتمام الشراء&quot;,&quot;s1&quot;:&quot;بيانات التوصيل&quot;,&quot;s2&quot;:&quot;طريقة الدفع&quot;,&quot;s3&quot;:&quot;المراجعة&quot;,&quot;name&quot;:&quot;الاسم بالكامل&quot;,&quot;email&quot;:&quot;البريد الإلكتروني&quot;,&quot;phone&quot;:&quot;الموبايل&quot;,&quot;city&quot;:&quot;المدينة&quot;,&quot;address&quot;:&quot;العنوان&quot;,&quot;next&quot;:&quot;متابعة&quot;,&quot;back&quot;:&quot;رجوع&quot;,&quot;place&quot;:&quot;تأكيد الطلب&quot;,&quot;payTitle&quot;:&quot;تحبي تدفعي إزاي؟&quot;,&quot;methods&quot;:{&quot;cod&quot;:{&quot;label&quot;:&quot;الدفع عند الاستلام&quot;,&quot;desc&quot;:&quot;ادفعي فلوس كاش لما الطلب يوصلك — الأسهل.&quot;},&quot;vf&quot;:{&quot;label&quot;:&quot;فودافون كاش&quot;,&quot;desc&quot;:&quot;حوّلي على 010 1234 5678 واكتبي رقم عملية التحويل.&quot;},&quot;or&quot;:{&quot;label&quot;:&quot;أورنج كاش&quot;,&quot;desc&quot;:&quot;حوّلي على 012 1234 5678 واكتبي رقم عملية التحويل.&quot;},&quot;et&quot;:{&quot;label&quot;:&quot;اتصالات كاش&quot;,&quot;desc&quot;:&quot;حوّلي على 011 1234 5678 واكتبي رقم عملية التحويل.&quot;},&quot;we&quot;:{&quot;label&quot;:&quot;وي كاش&quot;,&quot;desc&quot;:&quot;حوّلي على 015 1234 5678 واكتبي رقم عملية التحويل.&quot;},&quot;ip&quot;:{&quot;label&quot;:&quot;إنستاباي&quot;,&quot;desc&quot;:&quot;حوّلي بالإنستاباي واكتبي رقم عملية التحويل.&quot;}},&quot;ref&quot;:&quot;رقم عملية التحويل&quot;,&quot;errors&quot;:{&quot;name&quot;:&quot;من فضلك اكتبي اسمك&quot;,&quot;email&quot;:&quot;أدخلي بريدًا صحيحًا&quot;,&quot;phone&quot;:&quot;أدخلي رقم موبايل صحيح&quot;,&quot;city&quot;:&quot;أدخلي المدينة&quot;,&quot;address&quot;:&quot;أدخلي العنوان&quot;,&quot;ref&quot;:&quot;اكتبي رقم عملية التحويل (4 أرقام على الأقل)&quot;},&quot;mock&quot;:&quot;تجربة عرض — مفيش دفع حقيقي بيتم.&quot;,&quot;successTitle&quot;:&quot;تم تأكيد الطلب&quot;,&quot;successSub&quot;:&quot;شكرًا لكِ. رقم طلبك:&quot;,&quot;successPay&quot;:&quot;طريقة الدفع&quot;,&quot;successNote&quot;:&quot;في النسخة الحقيقية هيوصلك تأكيد بالبريد.&quot;,&quot;home&quot;:&quot;عودي للرئيسية&quot;}" hidden></div><div id="ck-root"></div></main></main><footer class="site-footer"><div class="footer-inner container"><span class="logo">N<span class="accent">i</span>vora</span><span>© 2026 نيفورا — جميع الحقوق محفوظة</span><span>صُنع بإتقان</span></div></footer><script type="module">var e=document.getElementById(`burger`),t=document.getElementById(`mobile-menu`),n=document.getElementById(`mm-close`),r=n=>{e?.setAttribute(`aria-expanded`,String(n)),t?.setAttribute(`aria-hidden`,String(!n)),document.body.style.overflow=n?`hidden`:``};e?.addEventListener(`click`,()=>r(e.getAttribute(`aria-expanded`)!==`true`)),n?.addEventListener(`click`,()=>r(!1)),t?.querySelectorAll(`a`).forEach(e=>e.addEventListener(`click`,()=>r(!1))),document.addEventListener(`keydown`,e=>{e.key===`Escape`&&r(!1)});var i=(e,t)=>{try{return JSON.parse(sessionStorage.getItem(e))||t}catch{return t}},a=()=>{let e=i(`nivora_bag`,[]).length,t=i(`nivora_wish`,[]).length,n=document.getElementById(`bag-count`),r=document.getElementById(`wish-count`);n&&(n.textContent=e,n.style.display=e?``:`none`),r&&(r.textContent=t,r.style.display=t?``:`none`)};window.nivoraBump=a,a();</script></body></html><script>
  const lang = document.documentElement.lang;
  const t = JSON.parse(document.getElementById('flow-data').dataset.t);
  const L = (en, ar) => (lang === 'ar' ? ar : en);
  const fmt = (n) => (lang === 'ar' ? n.toLocaleString('ar-EG') + ' ج' : 'EGP ' + n.toLocaleString('en-US'));
  const get = (k, d) => { try { return JSON.parse(sessionStorage.getItem(k)) || d; } catch { return d; } };
  const root = document.getElementById('ck-root');
  let step = 1;
  const data = { name: '', email: '', phone: '', city: '', address: '', pay: 'cod', ref: '' };
  let orderNo = '';

  const field = (id, label, val, half) =>
    '<div class="f-field' + (half ? '' : ' full') + '" id="w-' + id + '"><label for="' + id + '">' + label + '</label>' +
    '<input id="' + id + '" value="' + (val || '') + '"><span class="f-err"></span></div>';

  const payCard = (key) => {
    const m = t.methods[key];
    return '<label class="pay-opt' + (data.pay === key ? ' on' : '') + '" data-p="' + key + '">' +
      '<input type="radio" name="pay" value="' + key + '"' + (data.pay === key ? ' checked' : '') + '>' +
      '<span class="po-dot"></span><span class="po-txt"><b>' + m.label + '</b><small>' + m.desc + '</small></span></label>';
  };

  const render = () => {
    document.querySelectorAll('.step').forEach((s) => {
      const n = Number(s.dataset.s);
      s.classList.toggle('on', n === step);
      s.classList.toggle('done', n < step);
    });
    const items = get('nivora_bag', []);
    const total = items.reduce((s2, it) => s2 + it.price * (it.qty || 1), 0);

    if (step === 1) {
      root.innerHTML = '<form class="form-card" id="ck-form"><div class="f-grid">' +
        field('name', t.name, data.name) + field('email', t.email, data.email) +
        field('phone', t.phone, data.phone, true) + field('city', t.city, data.city, true) +
        field('address', t.address, data.address) +
        '</div><div class="f-actions"><span></span><button type="submit" class="btn btn-solid">' + t.next + '</button></div></form>';
    } else if (step === 2) {
      root.innerHTML = '<form class="form-card" id="ck-form">' +
        '<p class="pay-title">' + t.payTitle + '</p><div class="pay-list">' +
        payCard('cod') + payCard('vf') + payCard('or') + payCard('et') + payCard('we') + payCard('ip') +
        '</div>' +
        (data.pay !== 'cod' ? field('ref', t.ref, data.ref) : '') +
        '<p class="mock-note">' + t.mock + '</p>' +
        '<div class="f-actions"><button type="button" class="btn btn-outline" id="back">' + t.back + '</button><button type="submit" class="btn btn-solid">' + t.next + '</button></div></form>';
      root.querySelectorAll('.pay-opt').forEach((o) => o.addEventListener('click', () => {
        data.pay = o.dataset.p; render();
      }));
    } else if (step === 3) {
      root.innerHTML = '<div class="form-card">' +
        '<div class="rev-box"><b>' + t.s1 + '</b>' + data.name + ' · ' + data.email + '<br>' + data.city + ' — ' + data.address + '</div>' +
        '<div class="rev-box"><b>' + t.s2 + '</b>' + t.methods[data.pay].label + (data.ref ? ' · ' + L('Ref', 'مرجع') + ' ' + data.ref : '') + '</div>' +
        '<div class="rev-box"><b>' + L('ORDER', 'الطلب') + ' (' + items.length + ')</b>' + fmt(total) + '</div>' +
        '<div class="f-actions"><button class="btn btn-outline" id="back">' + t.back + '</button><button class="btn btn-solid" id="place">' + t.place + '</button></div></div>';
    } else {
      root.innerHTML = '<div class="success"><div class="tick">✓</div><h2>' + t.successTitle + '</h2>' +
        '<p>' + t.successSub + '</p><p class="order-no">NV-' + orderNo + '</p>' +
        '<p class="pay-line">' + t.successPay + ': <b>' + t.methods[data.pay].label + '</b></p>' +
        '<p class="mock-note">' + t.successNote + '</p>' +
        '<a href="/' + lang + '" class="btn btn-outline" style="margin-top:22px">' + t.home + '</a></div>';
      sessionStorage.removeItem('nivora_bag');
      window.nivoraBump?.();
    }

    document.getElementById('back')?.addEventListener('click', () => { step--; render(); });
    document.getElementById('place')?.addEventListener('click', () => {
      orderNo = String(Math.floor(100000 + Math.random() * 900000));
      step = 4; render();
    });
    document.getElementById('ck-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      let ok = true;
      const mark = (id, bad, msg) => {
        const w = document.getElementById('w-' + id);
        if (!w) return;
        w.classList.toggle('has-error', bad);
        w.querySelector('.f-err').textContent = bad ? msg : '';
        if (bad) ok = false;
      };
      if (step === 1) {
        const vals = { name: document.getElementById('name').value, email: document.getElementById('email').value,
          phone: document.getElementById('phone').value, city: document.getElementById('city').value, address: document.getElementById('address').value };
        Object.assign(data, vals);
        mark('name', vals.name.trim().length < 2, t.errors.name);
        mark('email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email), t.errors.email);
        mark('phone', !/^[0-9+\s]{8,}$/.test(vals.phone), t.errors.phone);
        mark('city', vals.city.trim().length < 1, t.errors.city);
        mark('address', vals.address.trim().length < 3, t.errors.address);
      } else if (step === 2) {
        if (data.pay !== 'cod') {
          const ref = document.getElementById('ref').value.trim();
          data.ref = ref;
          mark('ref', ref.length < 4, t.errors.ref);
        }
      }
      if (ok) { step++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  };
  render();
</script>
