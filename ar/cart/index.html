  const lang = document.documentElement.lang;
  const t = JSON.parse(document.getElementById('flow-data').dataset.t);
  const L = (en, ar) => (lang === 'ar' ? ar : en);
  const fmt = (n) => (lang === 'ar' ? n.toLocaleString('ar-EG') + ' ج' : 'EGP ' + n.toLocaleString('en-US'));
  const get = (k, d) => { try { return JSON.parse(sessionStorage.getItem(k)) || d; } catch { return d; } };
  const setS = (k, v) => sessionStorage.setItem(k, JSON.stringify(v));
  const root = document.getElementById('cart-root');

  const render = () => {
    const items = get('nivora_bag', []);
    if (!items.length) {
      root.innerHTML = '<div class="empty-state"><p class="e-big">' + t.empty + '</p><a href="/' + lang + '/shop" class="btn btn-outline">' + t.browse + '</a></div>';
      return;
    }
    const subtotal = items.reduce((s, it) => s + it.price * (it.qty || 1), 0);
    root.innerHTML =
      '<div class="cart-grid"><div class="cart-items">' +
      items.map((it, i) =>
        '<div class="c-item">' +
          '<img src="' + it.img + '" alt="" />' +
          '<div><div class="c-name">' + it.name + '</div>' +
          '<div class="c-meta">' + (it.size || '') + (it.color ? ' · ' + it.color : '') + '</div>' +
          '<div class="c-price">' + fmt(it.price) + '</div>' +
          '<div class="qty"><button data-i="' + i + '" data-d="-1" aria-label="minus">−</button><span>' + (it.qty || 1) + '</span><button data-i="' + i + '" data-d="1" aria-label="plus">+</button></div></div>' +
          '<button class="c-remove" data-rm="' + i + '">' + t.remove + '</button>' +
        '</div>'
      ).join('') +
      '</div><aside class="summary"><h2>' + L('ORDER SUMMARY', 'ملخص الطلب') + '</h2>' +
      '<div class="s-row"><span>' + t.subtotal + '</span><span>' + fmt(subtotal) + '</span></div>' +
      '<div class="s-row"><span>' + t.shipping + '</span><span class="free-tag">' + t.free + '</span></div>' +
      '<div class="s-row total"><span>' + t.total + '</span><strong>' + fmt(subtotal) + '</strong></div>' +
      '<a href="/' + lang + '/checkout" class="btn btn-solid checkout-cta">' + t.checkout + '</a>' +
      '<a href="/' + lang + '/shop" class="continue-link">' + t.continue + '</a></aside></div>';

    root.querySelectorAll('.qty button').forEach((b) => b.addEventListener('click', () => {
      const arr = get('nivora_bag', []);
      const i = Number(b.dataset.i);
      arr[i].qty = Math.max(1, (arr[i].qty || 1) + Number(b.dataset.d));
      setS('nivora_bag', arr); render();
    }));
    root.querySelectorAll('.c-remove').forEach((b) => b.addEventListener('click', () => {
      const arr = get('nivora_bag', []);
      arr.splice(Number(b.dataset.rm), 1);
      setS('nivora_bag', arr); render(); window.nivoraBump?.();
    }));
  };
  render();
</script>
