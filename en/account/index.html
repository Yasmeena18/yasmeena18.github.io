/div><main><main class="container flow"><header class="flow-head"><p class="eyebrow">YOUR ACCOUNT</p><h1>Welcome</h1></header><div id="flow-data" data-t="{&quot;eyebrow&quot;:&quot;YOUR ACCOUNT&quot;,&quot;title&quot;:&quot;Welcome&quot;,&quot;signIn&quot;:&quot;Sign in&quot;,&quot;create&quot;:&quot;Create account&quot;,&quot;name&quot;:&quot;FULL NAME&quot;,&quot;email&quot;:&quot;EMAIL&quot;,&quot;password&quot;:&quot;PASSWORD&quot;,&quot;confirm&quot;:&quot;CONFIRM PASSWORD&quot;,&quot;go&quot;:&quot;CONTINUE&quot;,&quot;out&quot;:&quot;Sign out&quot;,&quot;errors&quot;:{&quot;name&quot;:&quot;Please enter your name&quot;,&quot;email&quot;:&quot;Enter a valid email&quot;,&quot;password&quot;:&quot;At least 8 characters&quot;,&quot;confirm&quot;:&quot;Passwords do not match&quot;,&quot;exists&quot;:&quot;This email is registered — sign in instead&quot;,&quot;noUser&quot;:&quot;No account with this email — create one&quot;,&quot;wrong&quot;:&quot;Wrong password&quot;},&quot;welcome&quot;:&quot;Welcome back&quot;,&quot;member&quot;:&quot;Member since&quot;,&quot;orders&quot;:&quot;Orders&quot;,&quot;wishlist&quot;:&quot;Wishlist items&quot;,&quot;bag&quot;:&quot;In your bag&quot;}" hidden></div><div id="acc-root"></div></main></main><footer class="site-footer"><div class="footer-inner container"><span class="logo">N<span class="accent">i</span>vora</span><span>© 2026 Nivora — All rights reserved</span><span>Crafted with precision</span></div></footer><script type="module">var e=document.getElementById(`burger`),t=document.getElementById(`mobile-menu`),n=document.getElementById(`mm-close`),r=n=>{e?.setAttribute(`aria-expanded`,String(n)),t?.setAttribute(`aria-hidden`,String(!n)),document.body.style.overflow=n?`hidden`:``};e?.addEventListener(`click`,()=>r(e.getAttribute(`aria-expanded`)!==`true`)),n?.addEventListener(`click`,()=>r(!1)),t?.querySelectorAll(`a`).forEach(e=>e.addEventListener(`click`,()=>r(!1))),document.addEventListener(`keydown`,e=>{e.key===`Escape`&&r(!1)});var i=(e,t)=>{try{return JSON.parse(sessionStorage.getItem(e))||t}catch{return t}},a=()=>{let e=i(`nivora_bag`,[]).length,t=i(`nivora_wish`,[]).length,n=document.getElementById(`bag-count`),r=document.getElementById(`wish-count`);n&&(n.textContent=e,n.style.display=e?``:`none`),r&&(r.textContent=t,r.style.display=t?``:`none`)};window.nivoraBump=a,a();</script></body></html><script>
  const lang = document.documentElement.lang;
  const t = JSON.parse(document.getElementById('flow-data').dataset.t);
  const get = (k, d) => { try { return JSON.parse(sessionStorage.getItem(k)) || d; } catch { return d; } };
  const setS = (k, v) => sessionStorage.setItem(k, JSON.stringify(v));
  const root = document.getElementById('acc-root');
  let mode = 'in';

  const field = (id, label, type = 'text') =>
    '<div class="f-field full" id="w-' + id + '"><label for="' + id + '">' + label + '</label>' +
    '<input id="' + id + '" type="' + type + '"><span class="f-err"></span></div>';

  const render = () => {
    const user = get('nivora_user', null);
    if (user) {
      const bag = get('nivora_bag', []).length, wish = get('nivora_wish', []).length;
      root.innerHTML = '<div class="welcome-box"><h2>' + t.welcome + '، ' + user.name + '</h2>' +
        '<p class="since">' + t.member + ' ' + user.since + '</p>' +
        '<div class="w-stats">' +
        '<div class="w-stat"><span class="n">0</span><span class="l">' + t.orders + '</span></div>' +
        '<div class="w-stat"><span class="n">' + wish + '</span><span class="l">' + t.wishlist + '</span></div>' +
        '<div class="w-stat"><span class="n">' + bag + '</span><span class="l">' + t.bag + '</span></div></div>' +
        '<button class="btn btn-outline" id="out">' + t.out + '</button></div>';
      document.getElementById('out')?.addEventListener('click', () => { sessionStorage.removeItem('nivora_user'); render(); });
      return;
    }
    root.innerHTML = '<div class="tabs">' +
      '<button id="tab-in" class="' + (mode === 'in' ? 'on' : '') + '">' + t.signIn + '</button>' +
      '<button id="tab-up" class="' + (mode === 'up' ? 'on' : '') + '">' + t.create + '</button></div>' +
      '<form class="acc-card" id="acc-form" style="border-top:none">' +
      (mode === 'up' ? field('name', t.name) : '') +
      field('email', t.email, 'email') + field('password', t.password, 'password') +
      (mode === 'up' ? field('confirm', t.confirm, 'password') : '') +
      '<button type="submit" class="btn btn-solid" style="width:100%">' + t.go + '</button></form>';

    document.getElementById('tab-in')?.addEventListener('click', () => { mode = 'in'; render(); });
    document.getElementById('tab-up')?.addEventListener('click', () => { mode = 'up'; render(); });

    document.getElementById('acc-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const users = get('nivora_users', {});
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;
      let ok = true;
      const mark = (id, bad, msg) => {
        document.getElementById('w-' + id)?.classList.toggle('has-error', bad);
        if (document.querySelector('#w-' + id + ' .f-err')) document.querySelector('#w-' + id + ' .f-err').textContent = bad ? msg : '';
        if (bad) ok = false;
      };
      mark('email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email), t.errors.email);
      mark('password', pass.length < 8, t.errors.password);
      if (mode === 'up') {
        const name = document.getElementById('name').value.trim();
        const confirm = document.getElementById('confirm').value;
        mark('name', name.length < 2, t.errors.name);
        mark('confirm', confirm !== pass, t.errors.confirm);
        mark('email', !!users[email], t.errors.exists);
        if (ok) {
          users[email] = { name, pass, since: new Date().toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-GB') };
          setS('nivora_users', users);
          setS('nivora_user', { name, email: email, since: users[email].since });
          render();
        }
      } else {
        if (ok) {
          const u = users[email];
          if (!u) mark('email', true, t.errors.noUser);
          else if (u.pass !== pass) mark('password', true, t.errors.wrong);
          else { setS('nivora_user', { name: u.name, email, since: u.since }); render(); }
        }
      }
    });
  };
  render();
</script>
