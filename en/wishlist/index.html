  const lang = document.documentElement.lang;
  const t = JSON.parse(document.getElementById('flow-data').dataset.t);
  const fmt = (n) => (lang === 'ar' ? n.toLocaleString('ar-EG') + ' ج' : 'EGP ' + n.toLocaleString('en-US'));
  const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
  const setS = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const root = document.getElementById('wish-root');

  const render = () => {
    const items = get('nivora_wish', []);
    if (!items.length) {
      root.innerHTML = '<div class="empty-state"><p class="e-big">' + t.empty + '</p><a href="/' + lang + '/shop" class="btn btn-outline">' + t.browse + '</a></div>';
      return;
    }
    root.innerHTML = items.map((it, i) =>
      '<div class="w-item">' +
        '<img src="' + it.img + '" alt="" />' +
        '<div><div class="c-name">' + it.name + '</div><div class="c-price">' + fmt(it.price) + '</div></div>' +
        '<div class="w-actions"><button class="btn btn-outline" data-mv="' + i + '" style="padding:9px 18px;font-size:12px">' + t.move + '</button>' +
        '<button class="c-remove" data-rm="' + i + '">' + t.remove + '</button></div>' +
      '</div>'
    ).join('');

    root.querySelectorAll('[data-mv]').forEach((b) => b.addEventListener('click', () => {
      const w = get('nivora_wish', []);
      const bag = get('nivora_bag', []);
      const it = w.splice(Number(b.dataset.mv), 1)[0];
      bag.push({ id: it.id, name: it.name, price: it.price, img: it.img, size: '', color: '', qty: 1 });
      setS('nivora_wish', w); setS('nivora_bag', bag);
      window.nivoraBump?.(); render();
      const n = document.getElementById('moved-note');
      n.classList.add('on'); setTimeout(() => n.classList.remove('on'), 2200);
    }));
    root.querySelectorAll('.c-remove').forEach((b) => b.addEventListener('click', () => {
      const w = get('nivora_wish', []);
      w.splice(Number(b.dataset.rm), 1);
      setS('nivora_wish', w); window.nivoraBump?.(); render();
    }));
  };
  render();
</script>
